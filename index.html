<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DA_WEBUI_KIT.md §7.2: themeColor = 라이트 캔버스 #F4F5F7 -->
    <meta name="theme-color" content="#F4F5F7" />
    <!--
      킷 §5의 1순위 폰트 스택은 Pretendard다. 시스템에 설치되어 있지 않은
      환경에서도 동일한 타이포를 보장하기 위해 가변 웹폰트를 CDN에서 로드한다
      (실패 시 tokens.css의 폴백 스택 -apple-system → Noto Sans KR로 이어진다).
    -->

      rel="stylesheet"
      as="style"

    />
